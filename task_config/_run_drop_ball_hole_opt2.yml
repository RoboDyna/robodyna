render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment:
- ur5-wsg
- ur5-wsg
- 0.6
language_num: 100
eval_step_limit: 15000
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 1
collect_data: true
eval_video_log: false
check_render_success: false
export_lerobot: true
lerobot_root: ./data_lerobot/prod_run/drop_ball_hole__opt2
lerobot_chunks_size: 1000
lerobot_task_state_dim: 32
interactive_params:
  xy_speed: 0.3456
  z_speed: 0.2688
  roll_speed: 1.536
  max_dt: 0.05
  max_lead: 0.0528
  max_joint_speed: 4.8
task_args:
  drop_ball_hole:
    container_shape: cylinder
    bucket_half: 0.12
    randomize_container_radius: true
    container_radius_jitter: 0.15
    cylinder_hole_inset: 0.025
    cylinder_hole_edge_clearance: 0.008
    spin_speed: 1.216
    spin_speed_jitter: 0.2
    hole_align_tol: 0.015
    release_open_steps: 300
    release_fraction: 0.5
    release_fall_lead_steps: 15
    release_hold_steps: 30
    release_upstream_m: 0.008
    r_tol: 0.06
    align_window: 0.18
    max_track_steps: 900
    ball_color:
    - 0.9
    - 0.1
    - 0.1
    ball_side: random
    ball_x_jitter: 0.02
    ball_y_jitter: 0.045
    force_platform_miss: false
    hole_xy_jitter: 0.012
    stick_to_surface: false
    add_dummy_hole: true
    stick_contact_steps: 4
    stick_settle_steps: 12
    stick_vel_tol: 0.05
    stick_z_tol: 0.012
    dummy_hole_radius_frac: 0.92
    dummy_hole_nest_depth: 0.35
save_failed_cases: false
save_data: false
