render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment:
- ur5-wsg
- ur5-wsg
- 0.6
language_num: 100
eval_step_limit: 15000
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 1
collect_data: true
eval_video_log: false
check_render_success: false
export_lerobot: true
lerobot_root: ./data_lerobot/prod_run/load_train__opt2
lerobot_chunks_size: 1000
lerobot_task_state_dim: 32
interactive_params:
  xy_speed: 0.3456
  z_speed: 0.2688
  roll_speed: 1.536
  max_dt: 0.05
  max_lead: 0.0528
  max_joint_speed: 4.8
task_args:
  load_train:
    n_wagons: 3
    target_wagon_mode: false
    tunnel_enabled: true
    tunnel_prob: 0.55
    tunnel_n_wagons_min: 2
    tunnel_n_wagons_max: 4
    tunnel_center_jitter: 0.4
    rail_radius: 0.2
    randomize_rail_radius: true
    rail_radius_jitter: 0.1
    train_omega_min: 0.1
    train_omega_max: 0.18
    ball_side: random
    ball_lateral_min: 0.07
    ball_lateral_max: 0.12
    ball_y_jitter: 0.02
    ball_radius: 0.0195
    car_floor_h: 0.014
    car_half_len: 0.045
    car_half_wid: 0.04
    car_arc_spacing: 0.1
    car_wall_h: 0.036
    ball_side_clearance: 0.11
    release_clearance_z: 0.2
    transport_clearance_z: 0.22
    pass_angle_offset: 0.22
    align_tol: 0.055
    release_open_steps: 300
    post_release_steps: 500
    catch_radius: 0.055
    drop_reach_tol: 0.03
    latch_z_max: 0.015
    latch_settle_steps: 12
save_failed_cases: false
save_data: false
