render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment:
- ur5-wsg
- ur5-wsg
- 0.6
language_num: 100
eval_step_limit: 15000
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 1
collect_data: true
eval_video_log: false
check_render_success: false
export_lerobot: true
lerobot_root: ./data_lerobot/prod_run/put_cup_belt__opt2
lerobot_chunks_size: 1000
lerobot_task_state_dim: 32
interactive_params:
  xy_speed: 0.3456
  z_speed: 0.2688
  roll_speed: 1.536
  max_dt: 0.05
  max_lead: 0.0528
  max_joint_speed: 4.8
task_args:
  put_cup_belt:
    curtain_freq: 0.5
    curtain_amp: 0.05
    belt_speed: 0.08
    belt_speed_jitter: 0.2
    curtain_size_jitter: 0.2
    belt_range: 0.08
    placement_tol: 0.05
    gap_tol: 0.06
    reach_tol: 0.05
    moving_component_spacing: 0.1
    randomize_slot_spacing: true
    moving_component_spacing_jitter: 0.15
    blue_curtains_enabled: false
    blue_curtain_dynamic_enabled: true
    random_mirror: true
    lift_off_only_after_place: false
    post_place_lift_z: 0.1
save_failed_cases: false
save_data: false
