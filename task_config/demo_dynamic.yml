    range_xy: [0.10, 0.14]
    range_center_xy: [0.0, 0.14]
    board_y: -0.02
    plate_y: -0.12
    cook_steps: 3076
    cook_speed_jitter: 0.20
    success_window_sec: 4.0
    shutoff_lead: 0.58
    cook_intensity: 0.70
    range_scale_mult: 1.0
    pan_scale: 1.0
    skillet_id: 2
    skillet_handle_yaw: 3.1416   # handle +Y (rear), clear of front-apron knob
    place_dx: 0.0
    place_dy: 0.0
    plate_scale: 0.715
    board_scale_mult: 0.0975
    knob_contact_radius: 0.06
    timer_radius: 0.045
    timer_n_sections: 24
    timer_x: -0.36              # top-left of table (x−, y+)
    timer_y: 0.28
  pour_beer:
    # KitchenS: hold the fancy tap push-button to pour; release to stop.
    # Foam % of stream rises with continuous hold time (resets on release). Pause to settle; overflow fails.
    # When pouring is done, click 050_bell (left/right of tap) to signal finish — scored on that press.
    # Mug glass materials match measure_ingredient jar (transmission / hollow viewer shell).
    # Layout: tap L/R + Y in [baseline−10cm, baseline]; mug under nozzle; bar props AABB-clear.
    scene_id: 0
    randomize_layout: true
    station_side: random
    station_x: 0.10
    cup_y: -0.08
    tap_dy: 0.12
    tap_y_down: 0.10
    station_x_range_left: [-0.16, -0.06]
    station_x_range_right: [0.06, 0.16]
    station_x_range: [0.06, 0.16]
    bell_side: random           # left | right | random of the tap
    bell_dx: 0.20               # m; lateral clearance from tap center
    pour_rate: 0.000715
    randomize_rates: true       # ±jitter on pour_rate + foam_gain (fill speed varies by run)
    pour_rate_jitter: 0.30      # ±30% fill-speed randomization
    foam_gain_jitter: 0.20      # ±20%
    # Stream foam % ramps start→peak over foam_ramp_steps of continuous hold; resets on release.
    foam_gain_start: 0.12
    foam_gain: 0.55
    foam_ramp_steps: 90
    foam_decay: 0.0045
    tap_settle_sec: 1.0  # button must stay released this long before fill quality can pass
    expert_foam_pause: 0.16
    expert_foam_resume: 0.09
    target_liquid: 0.85
    safe_total: 0.96
    full_liquid_tol: 0.05
  clean_table:
    # Per-seed layout: laptop L/R, mug 15–20 cm gap, spill ±30% speed, décor band.
