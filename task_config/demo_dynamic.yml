  fill_coffee_jar:
    # KitchenS: press button on coffee dispenser → beans into marked jar.
    # No microwave. Stove left|right; dispenser on the opposite half inside a
    # tight press-reliable band (far poses often register ~0 N on the button).
    # Jar stays under the nozzle. Decor clears stove/station/jar corridor.
    # Success = fill in [target_fill ± fill_tol]. Peak button press force → beans.
    target_fill: random         # 0.25 | 0.50 | 0.75 | random
    scene_id: 0
    stove_side: random          # left | right | random
    randomize_layout: true
    range_xy: [0.28, 0.14]
    range_x_right: 0.28
    range_x_left: -0.28
    station_x: -0.08            # |x| mirrored when stove is on the left
    station_x_left_lo: -0.105
    station_x_left_hi: -0.07
    station_x_right_lo: 0.055
    station_x_right_hi: 0.085
    disp_y: -0.02               # baseline dispenser Y
    disp_y_up: 0.015            # +1.5 cm (keep button press reliable)
    disp_y_down: 0.02           # −2 cm
    jar_y_min: -0.17
    beans_full: 160             # rim = 100% fill
    force_thresholds: [3.0, 6.0, 10.0, 14.0]   # N  (light → hard)
    beans_per_force_level: [1, 5, 10, 15]       # light → hard press
    randomize_beans_per_force_level: true       # ±beans_per_force_level_jitter per level
    beans_per_force_level_jitter: 0.10          # ±10% (kept non-decreasing)
    force_stiffness: 800.0      # N/m spring engagement proxy
    force_engage_slack: 0.05    # m pressure engagement above key top
    press_depths: [0.020, 0.030, 0.044, 0.057]  # expert depths for levels 1–4
    press_sample_s: 0.40
    fill_tol: 0.05              # ±5% success band
    coffee_box_id: -1           # -1 = random 113_coffee-box
    milk_box_id: -1             # -1 = random 038_milk-box
    mug_id: -1                  # -1 = random 039_mug
