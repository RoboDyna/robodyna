# Per-task rollout cutoff for policy evaluation, in policy steps.
#
# One policy step is one `TASK_ENV.take_action(...)`, i.e. one recorded frame at 16.667 Hz, so these
# numbers are directly comparable with the episode lengths of the published demonstrations.
#
# demo_dynamic.yml has a single shared `eval_step_limit: 15000`
# (envs/utils/household_view.py::EPISODE_MAX_STEPS). That guard is sized for data collection, where
# envs/_base_task.py::_episode_step_count counts saved frames. With `save_data` off the same counter
# counts `take_action_cnt`, so in evaluation 15000 is roughly forty times the longest expert
# demonstration and a failing rollout would run for a very long time.
#
# `step_limit` is 1.2x the longest expert episode of that task, rounded up, measured over all
# published demonstration episodes with every condition of a task pooled (a scenario only
# lengthens an episode). A policy that has not finished within 1.2x the slowest scripted
# demonstration has failed the episode.
#
# `episode_length` records the per-task episode lengths in the published demonstrations. Both
# blocks are computed from `<lerobot_root>/*/meta/episodes.jsonl`.
version: 1

step_limit:
  boil_milk: 374
  catch_cuboid: 411
  catch_cup: 837
  catch_marbles_trapdoors: 136
  catch_mouse_object_drop: 1028
  catch_ramp_ball: 3010
  catch_shelf_marble: 477
  catch_valley_ball: 286
  clean_table: 339
  control_quality: 324
